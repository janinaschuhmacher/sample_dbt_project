models:
  - name: stg_customers
    description: Cleaned customer records
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: signup_date
        tests:
          - not_null
      - name: country
        tests:
          - not_null

  - name: stg_sales_orders
    description: Cleaned sales order records
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'cancelled']

  - name: stg_sales_order_items
    description: Cleaned sales order item records
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_position
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: line_amount
        tests:
          - not_null
